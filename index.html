<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1220">
  <meta name="description" content="A personal calendar for vitamins, activities, and schedules.">
  <title>Daily Rhythm</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230c1220'/%3E%3Cpath d='M18 34h9l4-14 6 25 4-11h7' fill='none' stroke='%23c8ff64' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Daily Rhythm home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M4 17h5l3-9 4 17 3-8h9"/></svg></span>
        <span>Daily Rhythm</span>
      </a>
      <div class="header-actions">
        <button class="ghost-button today-button" id="todayButton">Today</button>
        <button class="add-button" id="openDialog"><span aria-hidden="true">+</span> Add entry</button>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="monthTitle">
        <div>
          <p class="eyebrow">Your month at a glance</p>
          <h1 id="monthTitle">September <span>2026</span></h1>
        </div>
        <div class="month-nav" aria-label="Change month">
          <button class="icon-button" id="prevMonth" aria-label="Previous month">←</button>
          <button class="icon-button" id="nextMonth" aria-label="Next month">→</button>
        </div>
      </section>

      <section class="workspace">
        <div class="calendar-card">
          <div class="weekdays" aria-hidden="true">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div class="calendar-grid" id="calendarGrid" aria-label="Monthly calendar"></div>
          <div class="legend" aria-label="Entry types">
            <span><i class="dot vitamin"></i> Vitamins</span>
            <span><i class="dot activity"></i> Activities</span>
            <span><i class="dot schedule"></i> Schedule</span>
          </div>
        </div>

        <aside class="day-panel" aria-labelledby="selectedDayTitle">
          <div class="day-panel-head">
            <div>
              <p class="eyebrow" id="selectedWeekday">Thursday</p>
              <h2 id="selectedDayTitle">17 September</h2>
            </div>
            <span class="completion-ring" id="completionRing" aria-label="0 of 0 completed">0%</span>
          </div>
          <div class="filters" role="tablist" aria-label="Filter entries">
            <button class="filter active" data-filter="all" role="tab" aria-selected="true">All</button>
            <button class="filter" data-filter="vitamin" role="tab" aria-selected="false">Vitamins</button>
            <button class="filter" data-filter="activity" role="tab" aria-selected="false">Activities</button>
            <button class="filter" data-filter="schedule" role="tab" aria-selected="false">Schedule</button>
          </div>
          <div class="entries" id="entryList"></div>
          <button class="panel-add" id="panelAdd"><span>+</span> Add to this day</button>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="entryDialog" aria-labelledby="dialogTitle">
    <form method="dialog" id="entryForm">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">New entry</p>
          <h2 id="dialogTitle">Plan your day</h2>
        </div>
        <button class="close-button" type="button" id="closeDialog" aria-label="Close">×</button>
      </div>
      <label>Type
        <select id="entryType" required>
          <option value="vitamin">Vitamin</option>
          <option value="activity">Activity</option>
          <option value="schedule">Schedule</option>
        </select>
      </label>
      <label>Name
        <input id="entryName" maxlength="60" placeholder="e.g. Vitamin D" required>
      </label>
      <div class="form-row">
        <label>Date
          <input id="entryDate" type="date" required>
        </label>
        <label>Time
          <input id="entryTime" type="time">
        </label>
      </div>
      <div class="dialog-actions">
        <button class="ghost-button" type="button" id="cancelDialog">Cancel</button>
        <button class="add-button" type="submit">Save entry</button>
      </div>
    </form>
  </dialog>

  <template id="entryTemplate">
    <article class="entry-card">
      <button class="check" aria-label="Mark complete"><span>✓</span></button>
      <div class="entry-copy">
        <p class="entry-type"></p>
        <h3></h3>
        <p class="entry-time"></p>
      </div>
      <button class="delete-entry" aria-label="Delete entry">×</button>
    </article>
  </template>
  <script src="./app.js"></script>
</body>
</html>
